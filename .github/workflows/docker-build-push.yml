name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------
      # BUILD DOCKER IMAGES
      # -----------------------------------------------------

      - name: Extract metadata for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            latest

# ------------------ DEBUG STEP ------------------
      - name: Show Events tags mono
        run: echo "EVENTS TAGS = '${{ steps.meta-events.outputs.tags }}'"

      - name: Build Monolith
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-monolith.outputs.tags }}

      - name: Extract metadata for Movies
        id: meta-movies
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            latest

      - name: Build Movies
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-movies.outputs.tags }}

      - name: Extract metadata for Events
        id: meta-events
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            latest
# ------------------ DEBUG STEP ------------------
      - name: Show Events tags 1
        run: echo "EVENTS TAGS = '${{ steps.meta-events.outputs.tags }}'"

      - name: Build Events
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-events.outputs.tags }}

      - name: Extract metadata for Proxy
        id: meta-proxy
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            latest
# ------------------ DEBUG STEP ------------------
      - name: Show Events tags 2
        run: echo "EVENTS TAGS = '${{ steps.meta-events.outputs.tags }}'"

      - name: Build Proxy
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-proxy.outputs.tags }}


      # -----------------------------------------------------
      # PUSH IMAGES (ONLY IF TESTS PASSED)
      # -----------------------------------------------------

      - name: Push Monolith
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}

      - name: Push Movies
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}

      - name: Push Events
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}

      - name: Push Proxy
        if: success()
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -f docker-compose.yml down
